# From the gjwgit/fluttertmpl Copier template. Values come from
# .copier-answers.yml. Local edits are kept by `copier update`, which
# merges template changes in.

name: billipod
summary: Manage bills with private storage in your Solid Pod.
description: |
  BilliPod collects together your regular bill payments, to track
  their scheduling and record their payment.

  All bills are stored, encrypted, in your personal online data store
  (Pod) within a Data Vault hosted by your Solid Server of choice.

# 20260924 gjw Named explicitly rather than relying on snapcraft finding
# snap/gui/icon.png by convention. This is the icon the Snap Store shows
# beside the listing, and the store limits it to 256kB.

icon: snap/gui/icon.png

base: core24
grade: stable
confinement: strict

# 20261030 gjw The version is read from pubspec.yaml by the
# override-build below rather than repeated here, so it cannot drift.
# The part dumps the prebuilt bundle, which holds no pubspec, so it is
# read from the project folder.

adopt-info: billipod

apps:
  billipod:
    command: billipod
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
      - desktop
      - desktop-legacy
      - home
      - network
      - opengl

      # 20260924 gjw solidpod keeps the security key through
      # flutter_secure_storage, which on GNU/Linux is libsecret talking to
      # gnome-keyring over the org.freedesktop.Secret.Service D-Bus name.
      # Without this plug AppArmor blocks that call and login stops at
      # "Cannot access secure storage ... An AppArmor policy prevents this
      # sender from sending this message to this recipient".
      #
      # NOT AUTO-CONNECTED. Unlike the other plugs here this one needs
      # either a snap declaration granted by the store reviewers or, for a
      # locally installed snap, an explicit
      #
      #     snap connect billipod:password-manager-service
      #
      # so declaring it is necessary but on its own not sufficient.

      - password-manager-service
      - wayland
      - x11

# 20260921 gjw The `flutter_secure_storage` package (and maybe
# `vault_storage`) is used by `solidpod/solidui` to save secrets
# locally, if the app provides this option to the user to do so. Thus
# `libsecret-1-0` and `libjsoncpp` are required to run the application.
# See
#
# https://github.com/juliansteenbakker/flutter_secure_storage/blob/develop/README.md
# https://pub.dev/packages/vault_storage/versions/2.2.0#platform-setup
#
# 20261029 gjw The app is NOT built here. The installers workflow builds
# the Flutter Linux release once for the deb, zip, snap and flatpak
# alike, and this part dumps that bundle, so only the stage packages are
# needed. To pack a snap locally, `flutter build linux --release` first,
# with $(DART_DEFINES) and $(OBFUSCATE) as `make flatpak` does.

parts:
  billipod:
    source: build/linux/x64/release/bundle
    plugin: dump
    override-build: |
      craftctl default
      craftctl set version="$(grep '^version:' $CRAFT_PROJECT_DIR/pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)"
    stage-packages:
      - libgtk-3-0
      - libjsoncpp-dev
      - libsecret-1-0
      - libssl3
